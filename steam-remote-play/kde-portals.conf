# Base xdg-desktop-portal config for KDE Plasma, installed to
# ~/.config/xdg-desktop-portal/kde-portals.conf by steam-remote-play-allow.sh
#
# xdg-desktop-portal reads only the first config file it finds (no merging),
# so this must contain everything from /usr/share/xdg-desktop-portal/kde-portals.conf
# plus our overrides. Re-check that file after Plasma updates.

[preferred]
# --- Plasma defaults (from /usr/share/xdg-desktop-portal/kde-portals.conf) ---
default=kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=plasmanotify

# --- Overrides ---
# Disable the RemoteDesktop portal so Steam Remote Play doesn't trigger the
# "Remote control requested" prompt on every connection (applies to all apps)
org.freedesktop.impl.portal.RemoteDesktop=none

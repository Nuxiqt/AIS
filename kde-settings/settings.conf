# Personal KDE settings for apply-kde-settings.sh (custom keybinds and preferences,
# not KDE defaults - review before applying on another setup)
# Format: file|group|key|value (value as stored in the KDE config file)
# Regenerate with: bash apply-kde-settings.sh export

# Disable volume change audio feedback
plasmaparc|General|AudioFeedback|false

# Application launcher icon (applied through plasmashell, not a config file)
@launcher|General|icon|/usr/share/pixmaps/archlinux-logo.png

# Keyboard layouts
kxkbrc|Layout|DisplayNames|,,
kxkbrc|Layout|LayoutList|us,lv,ru
kxkbrc|Layout|Use|true
kxkbrc|Layout|VariantList|,apostrophe,phonetic_mac

# Custom global shortcuts (only entries changed from KDE defaults)
kglobalshortcutsrc|KDE Keyboard Layout Switcher|Switch to Next Keyboard Layout|Meta+Ctrl+Space,Meta+Alt+K,Switch to Next Keyboard Layout
kglobalshortcutsrc|kwin|Expose|Ctrl+F9,Ctrl+F9\tMeta+F9,Toggle Present Windows (Current desktop)
kglobalshortcutsrc|kwin|ExposeAll|Launch (C)\tCtrl+F10,Launch (C)\tCtrl+F10\tMeta+F10,Toggle Present Windows (All desktops)
kglobalshortcutsrc|kwin|ExposeClass|Ctrl+F7,Ctrl+F7\tMeta+F7,Toggle Present Windows (Window class)
kglobalshortcutsrc|kwin|Overview|Ctrl+Up\tMeta+W,Meta+W,Toggle Overview
kglobalshortcutsrc|kwin|Switch One Desktop Up|none,Meta+Ctrl+Up,Switch One Desktop Up
kglobalshortcutsrc|kwin|Window Minimize|Alt+H\tMeta+PgDown,Meta+PgDown,Minimize Window
kglobalshortcutsrc|plasmashell|next activity|Meta+A,none,Walk through activities
kglobalshortcutsrc|plasmashell|previous activity|Meta+Shift+A,none,Walk through activities (Reverse)

# Konsole shortcuts (also used by Yakuake): @kxmlgui|file in kxmlgui5|action|shortcut
@kxmlgui|konsole/sessionui.rc|edit_copy|Ctrl+C; Ctrl+Ins
@kxmlgui|konsole/sessionui.rc|edit_paste|Ctrl+V; Shift+Ins

# VS Code keybindings (exported from Code, applied to every installed VS Code build)
@vscode|User|keybindings.json|vscode-keybindings.json
